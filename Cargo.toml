[workspace]
members = ["./src/*"]
default-members = ["src/bookworm"]
resolver = "3"

[workspace.package]
authors = ["Leo Borai <estebanborai@gmail.com>"]
version = "1.0.0-pre.788e607"
edition = "2024"
categories = ["web-programming"]
description = "Utilities to manage your ebook collection (PDFs, ePubs, KePubs, and more)"
documentation = "https://docs.rs/bookworm"
keywords = ["book", "pdf", "ebook", "kepub", "utils"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeoBorai/bookworm"
readme = "./README.md"


[workspace.dependencies]
anyhow = "1.0"
bytes = "1.11"
clap = "4.5"
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = "0.4"
js-sys = "0.3"
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
log = "0.4"
lopdf = "0.39"
memmap2 = "0.9"
serde = "1.0"
tokio = "1.49"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
xml-rs = "1.0"
zip = { version = "7", default-features = false }

bookworm = { path = "src/bookworm" }
